# dsh-bash-native bundle patch: two additive agent presets.
#
# This file is inserted whole over the profile's root, so it contributes rows and never
# reconfigures or disables a row another bundle owns. That is deliberate: the Web surface keeps
# the shell tools inside agent presets, and a bundle patch reaches every profile that includes
# this bundle, so replacing the host plane's `ctx.shell` here would silently break the shipped
# presets' `pwsh` tool (their PowerShell text would be handed to a bash engine).
#
# `preset-bash-native` mirrors the shipped `standard` preset's surface; `preset-bash-native-minimal`
# mirrors the shipped `minimal` one (a persona and a single persistent shell). Both mount the same
# two-sentence environment contract, so neither sets `promptDetail`: the key still validates, but it no
# longer changes the text, and a row must not look as if it did.
# `test-preset-parity.mjs` is the drift alarm for both mirrors.
#
# The shelved alternative lives in `overlays/single-agent-bash-native.yml`, which a single-agent
# surface (`dsh tui`, `dsh headless`, `dsh acp`) applies explicitly with `--patch`.
- insert:
    - id: preset-bash-native
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: bash-native
        name: Native Bash (Windows)
        description: A native POSIX bash on Windows (the brush engine this bundle ships and verifies; no MSYS runtime) with the harness file sandbox, background jobs, and spill-backed output.
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          # The shell group isolates `shell` and `terminals`, so this preset's executor is the
          # realm's executor: the host plane keeps its own provider for every other preset.
          - id: bash-native-shell
            name: cordis:group
            group: true
            isolate:
              shell: true
              terminals: true
            config:
              - id: bash-native
                name: dsh-bash-native
                config:
                  confine: true
                  requireEngineOnLoad: true
              - id: bash-native-terminal
                name: '@deepseek-ai/dsh-terminal'
              # `inject: [shell]` delays this row until the realm's executor exists, so the
              # expressions below can read the resolved engine.
              - id: bash-native-terminal-pty
                name: '@deepseek-ai/dsh-terminal-bash'
                inject: [shell]
                config:
                  backendType: shell
                  shellDialect: bash
                  shellPath: !!js ctx.get('shell')?.enginePath ?? ''
                  # Without the interactive argv a persistent session would start the engine with its
                  # own defaults: no toolchain on PATH, so `find`, `grep` and `timeout` would be the
                  # same-named Windows programs again. A PTY inherits the host environment rather than
                  # the executor's resolved one, which is why the executor also writes a startup file.
                  shellArgs: !!js ctx.get('shell')?.engineArgs ?? []
                  timeoutMs: 300000
              - id: tool-bash
                name: '@deepseek-ai/dsh-tool-bash'
              # Stateful alternative to `tool-bash`: both register the tool name `bash`, so
              # exactly one of the two may be enabled. Swap the two `disabled` flags to keep
              # cwd, exported variables, and background jobs across calls.
              - id: bash-native-persistent
                name: '@deepseek-ai/dsh-tool-bash-persistent'
                disabled: true
                config:
                  timeoutMs: 300000
                  description: |-
                    Run commands in a persistent bash shell
                    * State is persistent across command calls and discussions with the user.
                    * This is a bash (POSIX) shell on Windows, not PowerShell; use bash syntax and POSIX paths.
                    * `stty` does not exist in this environment, so input echo stays on.
                    * Please avoid commands that may produce a very large amount of output.
                    * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
    # The lean variant: the same engine and the same realm isolation, a persona, and one persistent bash
    # tool. It mirrors the shipped `minimal` preset's surface, which is why it carries no file tools, no
    # job tools and no delegation rows; the executor states the `minimal` contract to match.
    - id: preset-bash-native-minimal
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: bash-native-minimal
        name: Native Bash (Windows, minimal)
        description: The lean Native Bash preset — a persona and one persistent bash shell on the brush engine this bundle ships and verifies, with the short environment contract.
        order: 6
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a helpful software engineer assistant.
              complete: true
              includeRuntimeContext: false
          - id: bash-native-shell-minimal
            name: cordis:group
            group: true
            isolate:
              shell: true
              terminals: true
            config:
              - id: bash-native
                name: dsh-bash-native
                config:
                  confine: true
                  requireEngineOnLoad: true
              - id: bash-native-terminal
                name: '@deepseek-ai/dsh-terminal'
              - id: bash-native-terminal-pty
                name: '@deepseek-ai/dsh-terminal-bash'
                inject: [shell]
                config:
                  backendType: shell
                  shellDialect: bash
                  shellPath: !!js ctx.get('shell')?.enginePath ?? ''
                  shellArgs: !!js ctx.get('shell')?.engineArgs ?? []
                  timeoutMs: 300000
              # The lean preset offers the persistent tool only: a minimal surface is one shell, not a
              # choice between a one-shot and a stateful one.
              - id: bash-native-persistent
                name: '@deepseek-ai/dsh-tool-bash-persistent'
                config:
                  timeoutMs: 300000
                  description: |-
                    Run commands in a persistent bash shell
                    * State is persistent across command calls and discussions with the user.
                    * This is a bash (POSIX) shell on Windows, not PowerShell; use bash syntax and POSIX paths.
                    * `stty` does not exist in this environment, so input echo stays on.
                    * Please avoid commands that may produce a very large amount of output.
                    * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.
